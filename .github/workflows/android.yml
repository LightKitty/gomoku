name: Build & Release APK

# 触发方式：
#   - 推 tag（任意 tag 名）→ 打包并把 APK 挂到同名 GitHub Release 上
#   - 推 master / 提 PR / 手动触发 → 只打包，APK 作为 Actions 产物可下载
on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

# 创建 Release 需要写仓库内容权限；用内置 GITHUB_TOKEN 即可，不必另配 PAT
permissions:
  contents: write

jobs:
  build-apk:
    name: 打包 Release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # AGP 9.4 最低要求 JDK 17；仓库 gradle/gradle-daemon-jvm.properties 同样锁定 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里锁的是国内 Gradle 镜像（mirrors.cloud.tencent.com），
      # GitHub runner 在海外，连官方源更快更稳；版本号沿用仓库当前值。
      # 放在 setup-gradle 之前，让缓存 key 与实际发行源一致
      - name: 切换到官方 Gradle 发行源
        run: |
          VER=$(grep -o 'gradle-[0-9][^/]*-bin\.zip' gradle/wrapper/gradle-wrapper.properties | head -n1 | sed 's/^gradle-//; s/-bin\.zip$//')
          echo "Gradle 版本: $VER"
          sed -i "s|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${VER}-bin.zip|" gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # Gradle 依赖缓存（按 gradle 相关文件做 key）
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # runner 镜像已自带 platforms;android-37.0（compileSdk 37 在 AGP 9.4 下解析为
      # android-37.0），但 AGP 9.4.1 默认的 build-tools 是 36.0.0（ToolsRevisionUtils），
      # 两者都要在位；缺组件时 AGP 会去自动下载，而自动下载要求许可证已接受，
      # 所以这里无条件接受一次许可证，不能因为「组件看起来都在」就跳过。
      # 不用 android-actions/setup-android：它在当前 runner 上安装失败。
      - name: 准备 Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK 根目录: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          echo "sdkmanager: ${SDKMANAGER:-<未找到>}"
          MISSING=()
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] || MISSING+=("platforms;android-37.0")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || MISSING+=("build-tools;36.0.0")
          [ -d "$ANDROID_HOME/build-tools/37.0.0" ] || MISSING+=("build-tools;37.0.0")
          [ -d "$ANDROID_HOME/platform-tools" ] || MISSING+=("platform-tools")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "需要补装的 SDK 组件: ${MISSING[*]}"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::runner 镜像缺少 SDK 组件: ${MISSING[*]}，且没有 sdkmanager 可用"
              exit 1
            fi
          else
            echo "镜像已自带所需 SDK 组件"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if [ ${#MISSING[@]} -gt 0 ]; then
              "$SDKMANAGER" "${MISSING[@]}"
            fi
          fi
          echo "platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      # 环境自检：把 JDK / SDK / 仓库网络可达性打成 annotation。
      # GitHub 的完整 job 日志需要登录才能下载，annotation 匿名可读，是唯一免登录的诊断通道。
      # 本步骤刻意不失败：诊断信息要拿到后，再由后面的构建步骤给出真实结论。
      - name: 环境自检
        run: |
          set +e
          JAVA_LINE="$(java -version 2>&1 | head -n1)"
          PLATFORMS="$(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          {
            echo "### 环境自检"
            echo ""
            echo "- java: \`$JAVA_LINE\`"
            echo "- JAVA_HOME: \`${JAVA_HOME:-<空>}\`"
            echo "- ANDROID_HOME: \`${ANDROID_HOME:-<空>}\`"
            echo "- platforms: \`${PLATFORMS:-<空>}\`"
            echo "- build-tools: \`${BUILD_TOOLS:-<空>}\`"
            echo ""
            echo "| 仓库 | HTTP |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::java: $JAVA_LINE"
          echo "::notice::ANDROID_HOME=$ANDROID_HOME"
          echo "::notice::platforms: $PLATFORMS"
          echo "::notice::build-tools: $BUILD_TOOLS"
          for u in https://services.gradle.org/distributions/ https://maven.aliyun.com/repository/public/ https://dl.google.com/dl/android/maven2/ https://repo1.maven.org/maven2/ https://plugins.gradle.org/m2/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -L "$u" 2>/dev/null)"
            case "$code" in
              # 404 只说明该 Maven 仓库不允许列目录，不代表不可达
              200|301|302|403|404)
                echo "::notice::网络可达 $u -> HTTP $code"
                echo "| $u | $code |" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "::error::网络异常 $u -> HTTP ${code:-无响应}"
                echo "| $u | ${code:-无响应} |" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done
          # 插件标记（plugin marker）是插件解析的成败关键，逐个仓库精确探测
          MARKER="com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom"
          for u in "https://plugins.gradle.org/m2" "https://repo1.maven.org/maven2" "https://repo.maven.apache.org/maven2" "https://maven.aliyun.com/repository/public"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 -L "$u/$MARKER" 2>/dev/null)"
            echo "::notice::KSP 插件标记 $u -> HTTP ${code:-无响应}"
            echo "| $u/$MARKER | ${code:-无响应} |" >> "$GITHUB_STEP_SUMMARY"
          done
          # wrapper 自带下载能力：这里能验证 Gradle 发行包能否下载解压
          ./gradlew --version > /tmp/gradle-version.log 2>&1
          VSTATUS=$?
          echo "::notice::gradlew --version 退出码: $VSTATUS"
          cat /tmp/gradle-version.log
          {
            echo ""
            echo '```'
            cat /tmp/gradle-version.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -e

      # release 走 R8 + 字符串加密（buildSrc/EncryptStringsTask），签名用仓库内的 app/test.jks
      # 失败时把日志以 annotation 形式打出来，方便直接在 GitHub 上看到原因。
      # 注意：runner 默认 shell 带 errexit，失败管道会直接终止脚本，
      # 所以必须先 set +e，再用 PIPESTATUS 取 Gradle 的真实退出码。
      - name: 构建 Release APK
        run: |
          set +e
          set -o pipefail
          ./gradlew --init-script .github/ci-repositories.init.gradle assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Kotlin 编译错误（e: 行）出现在 FAILURE 块之前，必须单独抓，
            # 否则诊断里只剩 "Compilation error" 看不到真正原因
            ERRORS="$(grep -E '^e: ' /tmp/gradle-build.log | head -n 40)"
            DETAIL="$(awk '/^FAILURE: /{f=1} f && !/^[[:space:]]*at /{print}' /tmp/gradle-build.log | head -n 60)"
            TAIL="$(tail -n 40 /tmp/gradle-build.log)"
            {
              echo "### 构建失败"
              echo ""
              echo '```'
              echo "$ERRORS"
              echo '```'
              echo ""
              echo '```'
              echo "$DETAIL"
              echo '```'
              echo ""
              echo '```'
              echo "$TAIL"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # GitHub 每步最多 10 条 error 注解，所以把全文压进一条（%0A 表示换行）
            MSG="$(printf '构建失败。编译器错误：\n%s\n\nGradle 错误摘要：\n%s\n\n日志尾部：\n%s' "$ERRORS" "$DETAIL" "$TAIL")"
            esc="$(printf '%s' "$MSG" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            esc="${esc//$'\n'/%0A}"
            echo "::error::${esc}"
            exit "$status"
          fi

      - name: 上传构建日志（失败时也保留）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: 收集产物
        run: |
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="gomoku-${GITHUB_REF_NAME}.apk"
          else
            NAME="gomoku-release.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          ls -lh dist
          sha256sum "dist/${NAME}"

      # Actions 页面可直接下载，无需打 tag
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: gomoku-apk
          path: dist/*.apk
          if-no-files-found: error

      # tag 触发时把 APK 挂到同名 Release 上（沿用官方 Build and Release APK 的语义）
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "五子棋 $TAG" \
            --notes "由 GitHub Actions 自动构建（release 变体：R8 混淆 + 资源压缩 + 字符串加密）" \
            dist/*.apk \
          || gh release upload "$TAG" dist/*.apk --clobber

      # 备注：官方 Marketplace 的 Build and Release APK（sangatdesai/release-apk）走的是
      # Debian 10 镜像里的 hub，而 Debian 10 的 apt 源已下线，该 Action 目前构建失败。
      # 如需改用它，取消下面注释，并改用 PAT（Settings > Secrets > TOKEN，勾选 repo 权限）：
      # - name: Releasing using Hub
      #   if: startsWith(github.ref, 'refs/tags/')
      #   uses: sangatdesai/release-apk@main
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.TOKEN }}
      #     APP_FOLDER: app

  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 切换到官方 Gradle 发行源
        run: |
          VER=$(grep -o 'gradle-[0-9][^/]*-bin\.zip' gradle/wrapper/gradle-wrapper.properties | head -n1 | sed 's/^gradle-//; s/-bin\.zip$//')
          sed -i "s|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-${VER}-bin.zip|" gradle/wrapper/gradle-wrapper.properties

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 准备 Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          MISSING=()
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] || MISSING+=("platforms;android-37.0")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || MISSING+=("build-tools;36.0.0")
          [ -d "$ANDROID_HOME/build-tools/37.0.0" ] || MISSING+=("build-tools;37.0.0")
          [ -d "$ANDROID_HOME/platform-tools" ] || MISSING+=("platform-tools")
          if [ ${#MISSING[@]} -gt 0 ]; then
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::runner 镜像缺少 SDK 组件: ${MISSING[*]}，且没有 sdkmanager 可用"
              exit 1
            fi
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if [ ${#MISSING[@]} -gt 0 ]; then
              "$SDKMANAGER" "${MISSING[@]}"
            fi
          fi

      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      # 规则引擎 / AI / 协议字节冻结用例都在这里（domain/engine、domain/ai、data/net）
      # 同样先 set +e：否则失败管道会在 errexit 下直接终止脚本，诊断块不会执行
      - name: 运行单元测试
        run: |
          set +e
          set -o pipefail
          ./gradlew --init-script .github/ci-repositories.init.gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/gradle-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # 同上：编译错误行在 FAILURE 块之前，单独抓
            ERRORS="$(grep -E '^e: ' /tmp/gradle-test.log | head -n 40)"
            DETAIL="$(awk '/^FAILURE: /{f=1} f && !/^[[:space:]]*at /{print}' /tmp/gradle-test.log | head -n 60)"
            TAIL="$(tail -n 40 /tmp/gradle-test.log)"
            {
              echo "### 单元测试失败"
              echo ""
              echo '```'
              echo "$ERRORS"
              echo '```'
              echo ""
              echo '```'
              echo "$DETAIL"
              echo '```'
              echo ""
              echo '```'
              echo "$TAIL"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # GitHub 每步最多 10 条 error 注解，所以把全文压进一条（%0A 表示换行）
            MSG="$(printf '单元测试失败。编译器错误：\n%s\n\nGradle 错误摘要：\n%s\n\n日志尾部：\n%s' "$ERRORS" "$DETAIL" "$TAIL")"
            esc="$(printf '%s' "$MSG" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            esc="${esc//$'\n'/%0A}"
            echo "::error::${esc}"
            exit "$status"
          fi

      - name: 上传测试日志（失败时也保留）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-log
          path: /tmp/gradle-test.log
          if-no-files-found: ignore
